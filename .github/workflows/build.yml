name: Build sleepygram APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle variant to assemble'
        required: false
        default: 'fullArm64'
        type: choice
        options:
          - fullArm64
          - fullAfat
          - liteArm64
          - liteAfat
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865 cmake;4.0.2'

      - name: Set up Python 3.11
        if: ${{ startsWith(inputs.variant || 'fullArm64', 'full') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          {
            printf 'APP_ID = %s\n' "${APP_ID}"
            printf 'APP_HASH = "%s"\n' "${APP_HASH}"
            printf 'MAPS_V2_API = %s\n' "${MAPS_V2_API}"
            printf '\n'
            printf 'SIGNING_KEY_PASSWORD = %s\n' "${SIGNING_KEY_PASSWORD}"
            printf 'SIGNING_KEY_ALIAS = %s\n' "${SIGNING_KEY_ALIAS}"
            printf 'SIGNING_KEY_STORE_PASSWORD = %s\n' "${SIGNING_KEY_STORE_PASSWORD}"
          } > API_KEYS
          chmod 600 API_KEYS

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p TMessagesProj/config
          echo "${KEYSTORE_BASE64}" | base64 -d > TMessagesProj/config/exteraGram.jks

      - name: Install icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webp librsvg2-bin unzip

      - name: Fetch libXray
        run: ./scripts/fetch-libxray.sh

      - name: Configure local.properties
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          if [ -x "$(command -v python3.11 || true)" ]; then
            echo "python.build=$(command -v python3.11)" >> local.properties
          fi

      - name: Generate launcher icons
        run: ./gradlew :TMessagesProj:generateAppIcons --no-daemon

      - name: Build
        env:
          VARIANT: ${{ inputs.variant || 'fullArm64' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g'
        run: |
          set -euo pipefail
          TASK="assemble$(tr '[:lower:]' '[:upper:]' <<< "${VARIANT:0:1}")${VARIANT:1}$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_TYPE:0:1}")${BUILD_TYPE:1}"
          echo "Running :TMessagesProj:${TASK}"
          ./gradlew ":TMessagesProj:${TASK}" --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find TMessagesProj/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "${APK}" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${APK}")" >> "$GITHUB_OUTPUT"
          ls -lh "${APK}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleepygram-${{ inputs.variant || 'fullArm64' }}-${{ inputs.build_type || 'release' }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk }}
          generate_release_notes: true
